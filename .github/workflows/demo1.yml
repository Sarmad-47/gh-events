name: Events Demo 1
on:
  pull_request:
    types: [opened, closed]
  workflow_dispatch:
  push: # only targeting the main branch
    branches:
      - main
      - "dev-*" # dev-new dev-feature
      - "feat/**" # feat/one/two/three
    paths-ignore: # ignore changes to workflow files, will not trigger the workflow
      - ".github/workflows/*"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."
